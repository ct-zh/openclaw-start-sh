<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>本地网络采集</title>
    <style>
      body { box-sizing: border-box; font: 13px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; margin: 0; min-width: 290px; padding: 16px; }
      h1 { font-size: 16px; margin: 0 0 8px; }
      p { color: #444; margin: 0 0 12px; word-break: break-all; }
      button { background: #1677ff; border: 0; border-radius: 4px; color: #fff; cursor: pointer; padding: 8px 12px; }
      button.stop { background: #d4380d; }
      button:disabled { cursor: not-allowed; opacity: .55; }
      #status { border-radius: 4px; padding: 8px; }
      .idle { background: #f5f5f5; color: #555; }
      .active { background: #e6f4ff; color: #0958d9; }
      .error { background: #fff2f0; color: #cf1322; }
    </style>
  </head>
  <body>
    <h1>本地网络采集</h1>
    <p id="tab">正在读取当前标签页…</p>
    <p id="status" class="idle">未开始采集</p>
    <button id="toggle" disabled>开始采集</button>
    <script src="popup.js"></script>
  </body>
</html>
